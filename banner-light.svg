<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Kaloyan Gaydarov, full-stack web developer in Varna, Bulgaria. Web apps that control real hardware.">
  <defs>
    <radialGradient id="bg" cx="85%" cy="10%" r="95%"><stop offset="0" stop-color="#e8f5ec"/><stop offset=".5" stop-color="#f6faf7"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#2bb5b8"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#f39a5b"/></linearGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <style>
    .eyebrow { font: 600 13px 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; letter-spacing: 2.6px; fill: #1a7f37; }
    .name { font: 800 60px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #1f2328; }
    .tag { font: 700 30px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #1f2328; }
    .pill { font: 500 12.5px 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; }
    .foot { font: 500 12.5px 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #59636e; letter-spacing: .4px; }
    .label { font: 600 12px 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #1a7f37; letter-spacing: 1.5px; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .wire { stroke: #d0d7de; stroke-width: 2; stroke-dasharray: 4 6; fill: none; }
    .p { animation: go 2.4s linear infinite; fill: #1a7f37; }
    .p2 { animation-delay: 1.2s; }
    .p3 { animation-name: back; animation-delay: .6s; fill: #0969da; }
    @keyframes go   { 0% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateX(196px); opacity: 0; } }
    @keyframes back { 0% { transform: translateX(196px); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
    .arm { transform-box: view-box; transform-origin: 1062px 206px; animation: lift 4.8s ease-in-out infinite; }
    @keyframes lift { 0%, 30% { transform: rotate(0deg); } 45%, 75% { transform: rotate(-75deg); } 90%, 100% { transform: rotate(0deg); } }
    .led { animation: led 4.8s steps(1) infinite; }
    @keyframes led { 0% { fill: #cf222e; } 31% { fill: #1a7f37; } 86% { fill: #cf222e; } }
    .dot { animation: pulse 2s ease-in-out infinite; fill: #1a7f37; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .p, .arm, .led, .dot { animation: none; } }
  </style>
  <g clip-path="url(#r)">
  <rect width="1200" height="340" fill="url(#bg)"/>

  <circle class="dot" cx="66" cy="62" r="5"/>
  <text class="eyebrow" x="80" y="67">FULL-STACK WEB DEVELOPER · VARNA, BULGARIA</text>
  <text class="name" x="58" y="140">Kaloyan Gaydarov</text>
  <text class="tag" x="60" y="196">Web apps that control <tspan fill="#1a7f37">real hardware.</tspan></text>
  <rect x="60" y="236" width="106" height="30" rx="15" fill="#ffffff" stroke="#1a7f37"/><text class="pill" x="113" y="256" text-anchor="middle" fill="#1a7f37">TypeScript</text><rect x="174.0" y="236" width="81" height="30" rx="15" fill="#ffffff" stroke="#1a7f37"/><text class="pill" x="214" y="256" text-anchor="middle" fill="#1a7f37">Next.js</text><rect x="262.8" y="236" width="64" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text class="pill" x="295" y="256" text-anchor="middle" fill="#1f2328">React</text><rect x="334.8" y="236" width="47" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text class="pill" x="358" y="256" text-anchor="middle" fill="#1f2328">PHP</text><rect x="390.0" y="236" width="56" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text class="pill" x="418" y="256" text-anchor="middle" fill="#1f2328">MQTT</text><rect x="453.6" y="236" width="106" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/><text class="pill" x="507" y="256" text-anchor="middle" fill="#1f2328">WebSockets</text>
  <text class="foot" x="60" y="306">kaloyan.vercel.app · github.com/KaloyanG17</text>
  <text class="foot" x="1140" y="306" text-anchor="end">Open to web developer roles</text>

  <rect class="box" x="680" y="96" width="150" height="104" rx="8"/>
  <path d="M680 118H830" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="694" cy="107" r="4" fill="#cf222e"/>
  <circle cx="708" cy="107" r="4" fill="#9a6700"/>
  <circle cx="722" cy="107" r="4" fill="#1a7f37"/>
  <rect x="696" y="132" width="70" height="8" rx="4" fill="#d0d7de"/>
  <rect x="696" y="148" width="118" height="8" rx="4" fill="#eaeef2"/>
  <rect x="696" y="164" width="96" height="8" rx="4" fill="#eaeef2"/>
  <rect x="696" y="180" width="52" height="10" rx="5" fill="#1f883d"/>
  <text class="label" x="712" y="224">WEB APP</text>

  <path class="wire" d="M838 148H1036"/>
  <text class="label" x="890" y="134">MQTT / WS</text>
  <circle class="p" cx="842" cy="148" r="5"/>
  <circle class="p p2" cx="842" cy="148" r="5"/>
  <circle class="p p3" cx="842" cy="148" r="5"/>

  <path d="M1026 232H1180" stroke="#d0d7de" stroke-width="2"/>
  <rect class="box" x="1042" y="140" width="40" height="92" rx="6"/>
  <circle class="led" cx="1062" cy="160" r="6" fill="#cf222e"/>
  <g class="arm">
    <rect x="1062" y="200" width="112" height="12" rx="6" fill="#59636e"/>
    <rect x="1086" y="200" width="14" height="12" fill="#cf222e"/>
    <rect x="1114" y="200" width="14" height="12" fill="#cf222e"/>
    <rect x="1142" y="200" width="14" height="12" fill="#cf222e"/>
  </g>
  <circle cx="1062" cy="206" r="8" fill="#f6f8fa" stroke="#59636e" stroke-width="2"/>
  <text class="label" x="1046" y="256">GATE</text>
  <rect y="334" width="1200" height="6" fill="url(#bar)"/>
  </g>
</svg>
